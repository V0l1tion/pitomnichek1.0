<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e4d2b">
<title>Гектары Счастья · Учёт питомника</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Гектары Счастья">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&family=Unbounded:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">
      <span class="logo">
        <img src="logo.png" alt="" onerror="this.remove()" onload="this.nextElementSibling.style.display='none'">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="#fff" d="M12 21c-4-4-7-6.6-7-10.4C5 6.4 8.2 3.6 12 3c3.8.6 7 3.4 7 7.6 0 3.8-3 6.4-7 10.4z" opacity=".92"/><path d="M12 21V8l-3 3m3-3l3 3" stroke="#9fd3a8" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
      </span>
      <div class="brand-t"><h1>Гектары Счастья</h1><small>питомник · инвентаризация</small></div>
    </div>
    <div class="hdr-right">
      <span class="chip" id="hdr-code">код: —</span>
      <span class="chip net" id="hdr-net"><i></i><span>онлайн</span></span>
      <button class="gear" data-go="#/settings" aria-label="Настройки">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.2"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg>
      </button>
    </div>
  </header>
  <main id="view"></main>
  <nav id="tabbar">
    <button data-nav="#/sites"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg><span>Площадки</span></button>
    <button data-nav="#/labels"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11V4h7l11 11-7 7L3 11z"/><circle cx="8" cy="9" r="1.6" fill="currentColor"/></svg><span>Этикетки</span></button>
    <button data-nav="#/scan" class="fabbtn" aria-label="Сканер">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"/><path d="M3 12h18"/></svg>
      <span>Скан</span>
    </button>
    <button data-nav="#/reports"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></svg><span>Отчёты</span></button>
    <button data-nav="#/history"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg><span>История</span></button>
  </nav>
</div>
<div id="toasts"></div>
<div id="modal-root"></div>
<script defer src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script defer src="app.js"></script>
</body>
</html>
